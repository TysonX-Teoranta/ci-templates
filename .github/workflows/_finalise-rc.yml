# _finalise-rc.yml — reusable RC finalisation (artifact model).
# THIN YAML over the FAT bash spine: all cut logic (version calc, scrub, hygiene,
# build/test/publish, package, tag + prerelease) lives in cicd/rc/rc-finalise.sh,
# driven by the central domains.yml registry. Zero AI at runtime.
#
# Dev is the only workbench: the artifact is built ONCE here on the dev runner;
# staging/live only ever receive it. The notify job (pulse runner, mail stack)
# sends the single "RC finalised" mail — an essential per the email policy.
name: _finalise-rc
on:
  workflow_call:
    inputs:
      domain:
        description: "domains.yml key (must be status: active)"
        required: true
        type: string
      authorization_id:
        description: "Opaque, short-lived authorization ID issued by the trusted TOTP gateway"
        required: true
        type: string
      bump:
        description: "rc | patch | minor | major"
        required: false
        type: string
        default: rc
      dry_run:
        description: "build + prove hygiene only; no tag, no release, no mail"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "build runner label (the domain's dev box)"
        required: false
        type: string
        default: tysonx-dev
      pulse_runner_label:
        description: "pulse runner label (mail stack lives there)"
        required: false
        type: string
        default: tysonx-pulse
      spine_ref:
        description: "ci-templates ref used for an acceptance run; production callers use main"
        required: false
        type: string
        default: main

jobs:
  authorize:
    name: Claim TOTP authorization and singleton lifecycle
    runs-on: [self-hosted, "${{ inputs.pulse_runner_label }}"]
    timeout-minutes: 2
    outputs:
      lifecycle_id: ${{ steps.claim.outputs.lifecycle_id }}
    steps:
      # This installed, root-owned boundary runs before either product or spine
      # checkout. A direct workflow dispatch therefore fails without touching source.
      - name: Atomically claim authorization and Lodgers lifecycle
        id: claim
        env:
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          DOMAIN: ${{ inputs.domain }}
          ACTOR: ${{ github.actor }}
        run: |
          lifecycle_id=$(sudo -n /usr/local/sbin/tier0-rc-authorization claim \
            --authorization-id="$AUTHORIZATION_ID" --domain "$DOMAIN" --actor "$ACTOR")
          if ! sudo -n /usr/local/sbin/tier0-rc-authorization supervise-start \
            "$lifecycle_id" "$ACTOR" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; then
            sudo -n /usr/local/sbin/tier0-rc-authorization lifecycle fail \
              --lifecycle-id "$lifecycle_id" --actor "$ACTOR"
            exit 1
          fi
          printf 'lifecycle_id=%s\n' "$lifecycle_id" >> "$GITHUB_OUTPUT"

  finalise:
    name: Finalise RC (scrub + hygiene + build-once artifact)
    needs: authorize
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 345
    env:
      # The runner also has a user-local preview SDK. Pin host resolution to the
      # production SDK that satisfies the product's global.json.
      DOTNET_ROOT: /usr/lib/dotnet
      DOTNET_MULTILEVEL_LOOKUP: 0
    permissions:
      contents: write   # RC tag push + prerelease create
    outputs:
      rc_tag: ${{ steps.cut.outputs.rc_tag }}
      version: ${{ steps.cut.outputs.version }}
      artifact: ${{ steps.cut.outputs.artifact }}
    steps:
      - name: Verify authorized actor
        if: github.actor != 'lodgings-ie'
        run: exit 1

      - name: Checkout product repo (full history + tags for version lineage)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout ci-templates spine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TysonX-Teoranta/ci-templates
          ref: ${{ inputs.spine_ref }}
          path: .ci-templates

      - name: Select the dev-server .NET build mutex
        run: |
          if [ -x /home/deploy/bin/dotnet ]; then
            echo /home/deploy/bin >> "$GITHUB_PATH"
          fi

      - name: Structured migration classification and PostgreSQL proof
        timeout-minutes: 45
        env:
          TIER0_MIGRATION_EVIDENCE_DIR: ${{ runner.temp }}/tier0-migration-${{ github.run_id }}
          TIER0_DOTNET: /home/deploy/bin/dotnet
        run: |
          mkdir -p "$TIER0_MIGRATION_EVIDENCE_DIR"
          "$TIER0_DOTNET" --list-sdks | \
            tee "$TIER0_MIGRATION_EVIDENCE_DIR/sdk.txt" | \
            grep -F '10.0.110 [/usr/lib/dotnet/sdk]'
          chmod +x .ci-templates/cicd/migrations/*.sh .ci-templates/cicd/migrations/*.py
          .ci-templates/cicd/migrations/migration-gate.sh \
            2>&1 | tee "$TIER0_MIGRATION_EVIDENCE_DIR/gate.log"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-evidence-${{ inputs.domain }}
          path: ${{ runner.temp }}/tier0-migration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30

      - name: Cut RC (rc-finalise.sh — fat spine)
        id: cut
        env:
          DOMAIN: ${{ inputs.domain }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          # Per-run NuGet cache — MSB3030 concurrency fix, same as the old rc-cut lane.
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-${{ github.run_id }}
        run: |
          chmod +x .ci-templates/cicd/rc/rc-finalise.sh .ci-templates/cicd/lib/*.sh
          CICD_REGISTRY=.ci-templates/domains.yml .ci-templates/cicd/rc/rc-finalise.sh

      - name: Upload exact-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-source-evidence-${{ inputs.domain }}
          path: ${{ runner.temp }}/tier0-rc-source-evidence-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30

  notify:
    name: RC finalised notice (essential mail + close the refusal loop)
    needs: finalise
    if: ${{ success() && !inputs.dry_run }}
    runs-on: [self-hosted, "${{ inputs.pulse_runner_label }}"]
    timeout-minutes: 5
    permissions:
      issues: write   # a clean cut closes any open rc-refusal loop issue
    steps:
      - name: Close any open rc-refusal loop issue (cut is clean — loop complete)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.finalise.outputs.rc_tag }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          gh issue list -R "$REPO" --label rc-refusal --state open --json number -q '.[].number' 2>/dev/null \
            | while read -r n; do
                [ -n "$n" ] || continue
                gh issue close "$n" -R "$REPO" --reason completed \
                  --comment "Resolved — candidate $TAG cut clean (scrubbed, zero-stub, hygiene-proven)."
              done
          rm -f "$HOME/crom-queue/pending/RC-DECISION-$DOMAIN.md"
      - name: Send one mail via pulse sendmail
        env:
          DOMAIN: ${{ inputs.domain }}
          TAG: ${{ needs.finalise.outputs.rc_tag }}
        run: |
          {
            printf 'To: crom@tysonx.ie\n'
            printf 'From: crom@tysonx.ie\n'
            printf 'Auto-Submitted: auto-generated\n'
            printf 'Subject: [RC] %s %s finalised — ready for staging promote\n\n' "$DOMAIN" "$TAG"
            printf 'RC %s for %s is cut: live-ready by construction (scrubbed, zero-stub, hygiene-proven).\n' "$TAG" "$DOMAIN"
            printf 'This is the ONE open candidate for %s. Promote when ready:\n' "$DOMAIN"
            printf '  cicd promote %s staging --real --go        (opens your TOTP gate)\n' "$DOMAIN"
          } | /usr/sbin/sendmail -f crom@tysonx.ie -t

  refused:
    # RC LOOP, not a waterfall (Crom, 2026-07-05): a refusal loops the reasons back
    # into the dev workbench as ONE open 'rc-refusal' issue on the product repo.
    # Dev PRs fix + close it; the repo's rc-reloop workflow then re-orders the cut
    # automatically. A clean cut auto-closes any leftover refusal issue (notify job).
    name: RC refused — loop reasons back to dev as an issue (+ essential mail)
    needs: finalise
    if: ${{ failure() && !inputs.dry_run }}
    runs-on: [self-hosted, "${{ inputs.pulse_runner_label }}"]
    timeout-minutes: 5
    permissions:
      actions: read     # pull the failed job's log to extract the gate errors
      issues: write     # file/refresh the rc-refusal loop issue
      contents: read    # checkout the ci-templates spine (rc-loop-guard + registry)
    steps:
      - name: Checkout ci-templates spine (rc-loop-guard + registry)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TysonX-Teoranta/ci-templates
          ref: ${{ inputs.spine_ref }}
          path: .ci-templates
      - name: Bounded refusal loop + single-shot escalation (rc-loop-guard.sh — fat spine)
        env:
          DOMAIN: ${{ inputs.domain }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          CICD_REGISTRY: .ci-templates/domains.yml
        run: |
          chmod +x .ci-templates/cicd/rc/rc-loop-guard.sh .ci-templates/cicd/lib/*.sh
          .ci-templates/cicd/rc/rc-loop-guard.sh
