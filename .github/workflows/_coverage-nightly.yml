# _coverage-nightly.yml — CICD v2 (C178289477824693)
# RETIRED FROM CRON (Crom, 2026-08-07): heavy analysis moved to RC time — the
# `analyse` job in _finalise-rc.yml (rc-analyse.sh) now owns the coverage
# ratchet and Tier 2 mutation, bound to the exact cut source. Domain callers
# keep only workflow_dispatch so a manual re-measure stays possible; none may
# reintroduce a schedule (the single dev runner is required PR capacity).
#   1. ratchet-bump — re-measure coverage on the domain's dev HEAD and raise the
#      committed high-water baseline (never lowers it). The PR gate enforces
#      "never drop below baseline"; RC analysis is what normally RAISES it now.
#
# runs-on carries tysonx-dev-heavy as well as tysonx-dev: the pulse runner also
# advertises tysonx-dev, and a nightly that lands there has no dev toolchain, so
# coverlet instruments nothing and the ratchet dies on an empty report.

on:
  workflow_call:
    inputs:
      domain:
        description: "domains.yml key (e.g. lodgers)"
        required: true
        type: string
      test_project:
        description: "test project/solution to run for coverage + mutation"
        required: true
        type: string
      dev_branch:
        description: "the domain's dev branch (e.g. lodgers-dev)"
        required: true
        type: string
      coverage_baseline:
        description: "repo-relative ratchet file {line,branch} to raise"
        required: true
        type: string
      mutation_project:
        description: "csproj to mutate (Stryker target); empty = skip mutation"
        required: false
        type: string
        default: ""

concurrency:
  group: coverage-nightly-tysonx-dev
  cancel-in-progress: true

jobs:
  ratchet-bump:
    runs-on: [self-hosted, tysonx-dev, tysonx-dev-heavy]
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.dev_branch }}
          fetch-depth: 0
      - name: Checkout ci-templates spine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TysonX-Teoranta/ci-templates
          ref: main
          path: .ci-templates
      - name: Measure coverage (coverlet offline — line + branch, same recipe as the gate)
        env:
          DOTNET_gcServer: '0'
          # HEX. 0x70 = 112% = NO CAP — the only value proven green on lodgers. Real caps
          # below the testhost peak OOM the suite (0x2D -> 56-97 fails, 0x50 -> 10). See #89/#95.
          DOTNET_GCHeapHardLimitPercent: '70'
        run: |
          # Mirror the zero-tolerance gate: coverlet offline (profiler-free, emits
          # line AND branch on arm64), scoped to product assemblies via --include.
          # dotnet-coverage's cobertura carries no branch data, so the nightly could
          # never ratchet the branch baseline off it.
          dotnet tool install --global coverlet.console >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p ./coverage
          dotnet build "${{ inputs.test_project }}" -c Debug
          TEST_BIN="$(dirname "${{ inputs.test_project }}")/bin/Debug"
          [ -d "$TEST_BIN" ] || TEST_BIN="."
          TDIR="$(find "$TEST_BIN" -maxdepth 1 -type d -name 'net*' | head -1)"
          [ -n "$TDIR" ] || TDIR="$TEST_BIN"
          INCLUDES=""
          while IFS= read -r name; do
            [ -n "$name" ] && INCLUDES="$INCLUDES --include [$name]*"
          done < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' \
            | grep -viE '/[^/]*tests?\.csproj$' \
            | while IFS= read -r proj; do
                name="$(sed -n 's:.*<AssemblyName>[[:space:]]*\([^<]*[^<[:space:]]\)[[:space:]]*</AssemblyName>.*:\1:p' "$proj" | head -1)"
                echo "${name:-$(basename "$proj" .csproj)}"
              done)
          echo "coverlet product includes:$INCLUDES"
          case "${{ inputs.test_project }}" in
            *.sln|*.slnx)
              # SOLUTION test_project (kukuln): the single-TDIR resolution above lands
              # on "." (no dlls) and coverlet instruments NOTHING, so the ratchet dies
              # on an empty report. Same defect the gate carried until ci-templates#81;
              # the nightly kept its own copy of the recipe and never got the cure.
              # Instrument each test project's own output dir and accumulate through
              # coverlet's json merge; the last one also emits cobertura so the ratchet
              # sees one whole-suite report.
              FIRST=1
              while IFS= read -r tproj; do
                TB="$(dirname "$tproj")/bin/Debug"
                TD="$(find "$TB" -maxdepth 1 -type d -name 'net*' 2>/dev/null | head -1)"
                [ -n "$TD" ] || { echo "::warning::no build output for $tproj — skipped"; continue; }
                MERGE=""
                [ "$FIRST" -eq 0 ] && MERGE="--merge-with ./coverage/coverage.json"
                echo "=== solution coverage: $tproj"
                # shellcheck disable=SC2086
                coverlet "$TD" --target dotnet \
                  --targetargs "test $tproj --no-build" \
                  --format json --format cobertura --output ./coverage/ \
                  $MERGE $INCLUDES
                FIRST=0
              done < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' \
                | grep -iE '/[^/]*tests?\.csproj$' | sort)
              [ "$FIRST" -eq 0 ] || { echo "::error::no test projects with build output found in solution"; exit 1; }
              ;;
            *)
              # shellcheck disable=SC2086
              coverlet "$TDIR" --target dotnet \
                --targetargs "test ${{ inputs.test_project }} --no-build" \
                --format cobertura --output ./coverage/ \
                $INCLUDES
              ;;
          esac
      - name: Ratchet the baseline upward
        run: |
          COBERTURA=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          .ci-templates/cicd/lib/full-coverage.sh --cobertura "$COBERTURA" \
            --baseline "${{ inputs.coverage_baseline }}" --bump-baseline -v
      # Dev branches are protected (strict + enforce_admins) — a direct push is
      # rejected. So the raised baseline lands via an auto-merging PR, not a push.
      - name: Open PR to raise the baseline (only if it changed)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          if git diff --quiet -- "${{ inputs.coverage_baseline }}"; then
            echo "baseline unchanged — nothing to raise"; exit 0
          fi
          BR="cicd/coverage-baseline-bump-${{ github.run_id }}"
          git config user.name  lodgings-ie
          git config user.email 188377399+lodgings-ie@users.noreply.github.com
          git checkout -b "$BR"
          git add "${{ inputs.coverage_baseline }}"
          git commit -m "cicd(${{ inputs.domain }}): ratchet coverage baseline upward"
          git push origin "$BR"
          gh pr create --base "${{ inputs.dev_branch }}" --head "$BR" \
            --title "cicd(${{ inputs.domain }}): ratchet coverage baseline upward" \
            --body "Automated high-water bump from the nightly re-measure. Auto-merges on green."
