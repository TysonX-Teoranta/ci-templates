# _checks-zero-tolerance.yml — CICD v2 step 3 (C178289477824693)
# Reusable dev-stage zero-tolerance gate. THIN YAML over the FAT bash spine: the
# code-quality verdict (dotnet build with CS/IDE/CA/SA incl. CS1591 as hard errors,
# plus the comment-density heuristic) is produced by ONE entry point — cicd/checks.sh
# — driven by the central domains.yml registry, so per-repo gate copies cannot drift.
# The YAML only wires triggers, checks out code, runs tests for coverage, and calls
# the deterministic bash checks (diff-coverage, retry-tracker). Zero AI at runtime.
#
# Called by a domain repo`s own thin ci.yml via workflow_call, on pull_request only
# (retry-tracker needs a PR). Wired live into lodgers (checks.yml + dev-automerge.yml,
# merged lodgers#280). kukuln/tysonx remain on-hold/stub in domains.yml until active.

on:
  workflow_call:
    inputs:
      domain:
        description: "domains.yml key (e.g. lodgers) — selects the app project/dirs/base the gate builds"
        required: true
        type: string
      test_project:
        description: "test project/solution to run for coverage; empty = skip test+diff-coverage for this domain"
        required: false
        type: string
        default: ""
      test_slices:
        description: "run the suite in N sequential namespace slices (1 = single run). Bounds PEAK memory to the largest slice so big suites fit the smaller self-hosted boxes; coverage is merged back into one whole-suite report."
        required: false
        type: number
        default: 1
      runner_label:
        description: "self-hosted runner label to gate on; heavy suites (lodgers) pin tysonx-dev-heavy so they never land on the weaker pulse lane"
        required: false
        type: string
        default: "tysonx-dev"
      max_open_prs:
        description: "backpressure cap: only the N oldest open PRs to this base are gated; younger ones fast-fail with a consolidate message until the queue drains (0 disables)"
        required: false
        type: number
        default: 6
      scope:
        description: "'diff' (changed .cs vs the domain dev_base) or 'whole' (day-1 cleanup)"
        required: false
        type: string
        default: diff
      min_comment_ratio:
        description: "comment/code floor for the advisory comment-density check"
        required: false
        type: number
        default: 0.10
      min_diff_coverage:
        required: false
        type: number
        default: 80
      min_diff_branch:
        description: "floor for BRANCH coverage of changed lines; 0 = report-only (defaults to min_diff_coverage in the script when unset there)"
        required: false
        type: number
        default: 0
      min_total_coverage:
        description: "floor for TOTAL product line coverage (ratchet toward 100); 0 = report-only"
        required: false
        type: number
        default: 0
      min_total_branch:
        description: "floor for TOTAL product branch coverage; 0 = report-only"
        required: false
        type: number
        default: 0
      coverage_baseline:
        description: "path (repo-relative) to the ratchet high-water file {line,branch}; empty = no ratchet"
        required: false
        type: string
        default: ""
      retry_limit:
        required: false
        type: number
        default: 10
      strict_density:
        description: "make comment-density findings gate-failing (default: advisory, non-blocking)"
        required: false
        type: boolean
        default: false
      tier0_watchdog:
        description: "run the single-project coverage command inside the proven primary-runner watchdog"
        required: false
        type: boolean
        default: false
      spine_ref:
        description: "ci-templates ref used for an acceptance run; production callers use main"
        required: false
        type: string
        default: main

# Serialize the gate on the shared dev box. All zero-tolerance runs execute on the
# TWO self-hosted tysonx-dev runners now serve this gate (dev cax31 + the caged
# pulse-org lane), and each runner takes exactly one job at a time — so runner-level
# queueing is the throttle that keeps two suites off one box, not a constant group.
# A per-repo/per-ref group lets distinct PRs gate in parallel (one per runner) while
# same-branch retriggers still queue behind their own live run;
# cancel-in-progress:false never kills a live gating run.
concurrency:
  group: zero-tolerance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-tolerance:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Backpressure guard — the 2026-07-26..31 incident: a generator opened ~20
      # PRs/hr into a ~1 gate/hr lane and the queue diverged for 5 days (44 open).
      # Two deterministic rules, enforced BEFORE any checkout/build so a flooded
      # queue costs seconds per excess PR, not hour-long gate slots:
      #   1. CAP: only the max_open_prs OLDEST open PRs to this base get gated;
      #      younger ones fail fast. Self-draining — as the head merges, the next
      #      oldest becomes eligible on rerun.
      #   2. ONE ROLLING CAMPAIGN PR: a head branch ending in a batch counter
      #      (…batch12, …wave3) fast-fails while an OLDER open PR of the same
      #      branch family exists — bulk campaigns must consolidate, never fan out.
      - name: Queue guard (backpressure)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          CAP: ${{ inputs.max_open_prs }}
        run: |
          PAIRS=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_REF&per_page=100" \
            --jq '.[] | "\(.number) \(.head.ref)"' | sort -n)
          TOTAL=$(printf '%s\n' "$PAIRS" | grep -c . || true)
          echo "queue guard: $TOTAL open PRs to $BASE_REF (cap $CAP), this=#$PR_NUM"
          if [ "${CAP:-0}" -gt 0 ] && [ "$TOTAL" -gt "$CAP" ]; then
            if ! printf '%s\n' "$PAIRS" | head -n "$CAP" | awk '{print $1}' | grep -qx "$PR_NUM"; then
              echo "::error::queue full — $TOTAL open PRs to $BASE_REF (cap $CAP) and #$PR_NUM is not among the $CAP oldest. Consolidate into an existing PR or wait for the queue head to merge, then re-run."
              exit 1
            fi
          fi
          FAM=$(printf '%s' "$HEAD_REF" | sed -E 's/[0-9]+[A-Za-z]?$//')
          if [ "$FAM" != "$HEAD_REF" ] && [ -n "$FAM" ]; then
            OLDER=$(printf '%s\n' "$PAIRS" | awk -v fam="$FAM" -v me="$PR_NUM" '
              $1 < me && index($2, fam) == 1 {
                rest = substr($2, length(fam) + 1)
                if (rest ~ /^[0-9]+[A-Za-z]?$/) { print $1; exit }
              }')
            if [ -n "$OLDER" ]; then
              echo "::error::bulk-campaign rule — PR #$OLDER (same branch family '${FAM}N') is already open. One rolling PR per campaign: push further batches to that PR's branch instead of opening new PRs."
              exit 1
            fi
          fi

      - name: Checkout product repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # The spine (checks.sh + lib/*.sh + domains.yml) is versioned in ci-templates.
      # Pin to main: the feature branch that introduced these scripts is deleted after
      # merge, so a self-referential feature-branch ref would break every caller. When
      # a v1 release branch/tag is cut, track that instead.
      - name: Checkout ci-templates spine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TysonX-Teoranta/ci-templates
          ref: ${{ inputs.spine_ref }}
          path: .ci-templates

      - name: Capture immutable source identity before verification
        run: |
          python3 .ci-templates/cicd/lib/source-evidence.py capture \
            --repo "$GITHUB_WORKSPACE" \
            --allow-untracked .ci-templates \
            --output "$RUNNER_TEMP/tier0-source-evidence.json"

      - name: Select the dev-server .NET build mutex
        run: |
          if [ -x /home/deploy/bin/dotnet ]; then
            echo /home/deploy/bin >> "$GITHUB_PATH"
          fi

      - name: Zero-tolerance code-quality gate (checks.sh — build + analyzers + comment-density)
        id: gate
        env:
          CICD_MIN_COMMENT_RATIO: ${{ inputs.min_comment_ratio }}
        run: |
          chmod +x .ci-templates/cicd/checks.sh .ci-templates/cicd/lib/*.sh
          args=(--domain "${{ inputs.domain }}" --repo-root "$GITHUB_WORKSPACE" \
                --scope "${{ inputs.scope }}" --base "origin/${{ github.base_ref }}")
          [ "${{ inputs.strict_density }}" = "true" ] && args+=(--strict-density)
          .ci-templates/cicd/checks.sh "${args[@]}"

      - name: Verify source identity after code-quality gate
        run: |
          python3 .ci-templates/cicd/lib/source-evidence.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --allow-untracked .ci-templates \
            --evidence "$RUNNER_TEMP/tier0-source-evidence.json"

      - name: Test + coverage
        id: test
        if: inputs.test_project != ''
        # coverlet OFFLINE instrumentation roughly doubles wall-time vs plain test on
        # the arm64 runner: lodgers' 2204-test suite runs ~23 min bare but ~55-60+ min
        # instrumented, so the old 60-min step cap TIMED OUT lodgers' gate outright
        # (run 30256118640 failed at exactly 60m) — nothing could merge. The same wall
        # was hit again at 90: the suite is now 3291 tests, run 30725860572 (green,
        # 2026-08-02) spent 87m18s of the 90 in this step, and run 30744096931 died on
        # the cap with every test PASSED (Failed: 0, Passed: 3291) — 63 min of tests,
        # then coverlet sat 18 min in "Calculating coverage result…" and the cap fired.
        # 135 restores real headroom for suite growth plus that post-test coverlet tail,
        # and still lands inside the 150-min job cap with ~8 min for the surrounding
        # steps; the 8-min per-test blame-hang timeout below still catches a genuinely
        # wedged test, so this raises the ceiling without weakening any gate.
        timeout-minutes: 135
        env:
          # .NET's SkiaSharp/libgdiplus probes fontconfig at test-host exit. On the
          # arm64 runner fontconfig is installed but the test host can't find the
          # default config — it crashes with exit code 1 AFTER all tests pass.
          FONTCONFIG_FILE: /etc/fonts/fonts.conf
          FONTCONFIG_PATH: /etc/fonts
          # Runner OOM fix: .NET Server GC pre-allocates a heap PER CORE — on the
          # multi-core arm64 runner that blows past ~15 GiB under coverage instrumentation,
          # killing the runner mid-run ("operation was canceled" + orphaned coverlet after
          # tests already passed). Workstation GC uses one heap → far lower peak memory.
          DOTNET_gcServer: '0'
          # GC env vars are read as HEX. 0x70 = 112% = NO CAP — this is deliberate and is
          # the only value proven green on lodgers (run 30779316883: 3303 tests, 0 failed).
          # Real caps below the testhost peak OOM the suite: 0x2D=7GB -> 56-97 failures
          # (#89), 0x50=12.4GB -> 10 failures (#95). Do NOT set a real cap without first
          # measuring the lodgers peak under coverlet offline instrumentation.
          DOTNET_GCHeapHardLimitPercent: '70'
        run: |
          # Free the LibreTranslate sidecar's ~1.5 GiB for the coverage window if this
          # runner is permitted to (best-effort; a no-op where the service/perm is absent).
          sudo -n /usr/bin/systemctl stop libretranslate.service 2>/dev/null || true
          # Coverage on this linux-arm64 self-hosted runner uses coverlet OFFLINE
          # instrumentation (IL rewrite of the built product dlls, no profiler).
          # History of what does NOT work here:
          #   * dotnet-coverage / coverlet PROFILER (dynamic) collectors never
          #     attach on arm64 — they exit 0 and write an EMPTY cobertura,
          #     silently scoring every PR 0% (lodgers #294, runs 287059xxxxx).
          #   * dotnet-coverage STATIC instrument gives real LINE coverage but its
          #     cobertura carries NO branch data (br=0/0 -> vacuous 100% branch).
          # coverlet OFFLINE is profiler-free AND emits line AND branch. Proven on
          # this runner: 64 tests, branches-valid=148, branch-rate=0.61 on tysonx.
          # MUST scope instrumentation to the product assemblies via --include:
          # instrumenting the whole output dir rewrites every dependency and times
          # out (30-min cancel). One --include [<AssemblyName>]* per non-test proj.
          dotnet tool install --global coverlet.console --version 10.0.1 \
            || dotnet tool update --global coverlet.console --version 10.0.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          coverlet --version | grep -q '^10\.0\.1'
          mkdir -p ./coverage
          dotnet build "${{ inputs.test_project }}" -c Debug
          TEST_BIN="$(dirname "${{ inputs.test_project }}")/bin/Debug"
          [ -d "$TEST_BIN" ] || TEST_BIN="."
          TDIR="$(find "$TEST_BIN" -maxdepth 1 -type d -name 'net*' | head -1)"
          [ -n "$TDIR" ] || TDIR="$TEST_BIN"
          # product assemblies = this repo's non-test projects' OUTPUT names
          # (<AssemblyName> when set — tysonx: TysonxSite.csproj -> tysonx-site —
          # else the csproj basename). One coverlet --include filter per assembly.
          INCLUDES=()
          while IFS= read -r name; do
            [ -n "$name" ] && INCLUDES+=(--include "[$name]*")
          done < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' \
            -not -path './.ci-templates/*' -not -path './audit-harness/*' \
            | grep -viE '/[^/]*(tests?|playwright)\.csproj$' \
            | while IFS= read -r proj; do
                name="$(sed -n 's:.*<AssemblyName>[[:space:]]*\([^<]*[^<[:space:]]\)[[:space:]]*</AssemblyName>.*:\1:p' "$proj" | head -1)"
                echo "${name:-$(basename "$proj" .csproj)}"
              done)
          printf 'coverlet product include: %s\n' "${INCLUDES[@]}"
          SLICES="${{ inputs.test_slices }}"
          case "${{ inputs.test_project }}" in
            *.sln|*.slnx)
              # SOLUTION test_project (kukuln): the single-TDIR resolution above lands
              # on "." (no dlls) and coverlet instruments NOTHING — every kukuln gate
              # failed "coverage report is EMPTY" from the day this harness landed
              # (2026-07-26) until this branch. Instrument each test project's own
              # output dir and accumulate through coverlet's json merge; the final
              # project also emits cobertura so downstream sees one whole-suite report.
              : > "$RUNNER_TEMP/test-report.txt"
              FIRST=1
              while IFS= read -r tproj; do
                TB="$(dirname "$tproj")/bin/Debug"
                TD="$(find "$TB" -maxdepth 1 -type d -name 'net*' 2>/dev/null | head -1)"
                [ -n "$TD" ] || { echo "::warning::no build output for $tproj — skipped"; continue; }
                MERGE=""
                [ "$FIRST" -eq 0 ] && MERGE="--merge-with ./coverage/coverage.json"
                echo "=== solution coverage: $tproj"
                # shellcheck disable=SC2086
                coverlet "$TD" --target dotnet \
                  --targetargs "test $tproj --no-build --blame-hang-timeout 25m --blame-hang-dump-type mini" \
                  --format json --format cobertura --output ./coverage/ \
                  $MERGE "${INCLUDES[@]}" 2>&1 | tee -a "$RUNNER_TEMP/test-report.txt"
                test "${PIPESTATUS[0]}" -eq 0
                FIRST=0
              done < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' \
                | grep -iE '/[^/]*tests?\.csproj$' | sort)
              [ "$FIRST" -eq 0 ] || { echo "::error::no test projects with build output found in solution"; exit 1; }
              ;;
            *)
          if [ "${SLICES:-1}" -le 1 ]; then
            if [ "${{ inputs.tier0_watchdog }}" = true ]; then
              run_watchdog() {
                local evidence="$RUNNER_TEMP/tier0-watchdog-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$1"
                local coverlet_bin watchdog_tdir
                coverlet_bin=$(command -v coverlet)
                watchdog_tdir=$(realpath "$TDIR")
                flock -w 1800 /home/deploy/repo/lodgers-ai/.build-lock \
                  sudo -n /usr/local/sbin/tier0-test-watchdog "$evidence" -- \
                    "$GITHUB_WORKSPACE/.ci-templates/cicd/watchdog/coverage-command.sh" \
                    "$evidence" "$GITHUB_WORKSPACE/coverage/coverage.cobertura.xml" -- \
                    "$coverlet_bin" "$watchdog_tdir" --target /usr/bin/dotnet \
                    --targetargs "test $GITHUB_WORKSPACE/${{ inputs.test_project }} --no-build --blame-hang-timeout 25m --blame-hang-dump-type mini" \
                    --format cobertura --output "$GITHUB_WORKSPACE/coverage/" "${INCLUDES[@]}"
              }
              set +e
              run_watchdog 1 2>&1 | tee "$RUNNER_TEMP/test-report.txt"
              WATCHDOG_STATUS=${PIPESTATUS[0]}
              set -e
              if [ "$WATCHDOG_STATUS" -eq 75 ]; then
                echo "watchdog classified infrastructure failure; starting sole retry" | tee -a "$RUNNER_TEMP/test-report.txt"
                set +e
                run_watchdog 2 2>&1 | tee -a "$RUNNER_TEMP/test-report.txt"
                WATCHDOG_STATUS=${PIPESTATUS[0]}
                set -e
              fi
              test "$WATCHDOG_STATUS" -eq 0
            else
              # shellcheck disable=SC2086
              coverlet "$TDIR" --target dotnet \
                --targetargs "test ${{ inputs.test_project }} --no-build --blame-hang-timeout 25m --blame-hang-dump-type mini" \
                --format cobertura --output ./coverage/ \
                "${INCLUDES[@]}" 2>&1 | tee "$RUNNER_TEMP/test-report.txt"
              test "${PIPESTATUS[0]}" -eq 0
            fi
          else
            # SLICED RUN: the whole suite in one testhost peaks too high for the
            # smaller self-hosted boxes (OOM at any cgroup ceiling below ~10G).
            # Each slice is its own testhost that exits before the next starts, so
            # PEAK memory is bounded by the largest slice rather than the suite.
            # Coverage accumulates through coverlet's json merge and only the final
            # slice emits cobertura, so every downstream gate sees one whole-suite
            # report exactly as before.
            dotnet test "${{ inputs.test_project }}" --no-build --list-tests > ./coverage/all-tests.txt 2>&1 || {
              cat ./coverage/all-tests.txt; exit 1; }
            python3 - "$SLICES" <<'PY'
          import re, sys
          slices = int(sys.argv[1])
          ns = []
          for line in open("./coverage/all-tests.txt", errors="ignore"):
              line = line.strip()
              if not re.match(r'^[A-Za-z_][\w.]*\.[A-Za-z_]\w*\.[A-Za-z_]\w*', line):
                  continue
              fq = line.split('(')[0].strip()
              parts = fq.split('.')
              if len(parts) < 3:
                  continue
              n = '.'.join(parts[:-2])
              if n not in ns:
                  ns.append(n)
          if not ns:
              print("::error::slice discovery found no test namespaces"); sys.exit(1)
          buckets = [[] for _ in range(slices)]
          for i, n in enumerate(sorted(ns)):
              buckets[i % slices].append(n)
          with open("./coverage/slices.txt", "w") as fh:
              for b in buckets:
                  if b:
                      fh.write('|'.join(f"FullyQualifiedName~{x}." for x in b) + "\n")
          print(f"slice discovery: {len(ns)} namespaces -> {sum(1 for b in buckets if b)} slices")
          PY

            SLICE_NO=0
            TOTAL_SLICES=$(wc -l < ./coverage/slices.txt)
            : > "$RUNNER_TEMP/test-report.txt"
            while IFS= read -r FILTER; do
              SLICE_NO=$((SLICE_NO + 1))
              MERGE=""
              [ "$SLICE_NO" -gt 1 ] && MERGE="--merge-with ./coverage/coverage.json"
              FORMATS="--format json"
              [ "$SLICE_NO" -eq "$TOTAL_SLICES" ] && FORMATS="--format json --format cobertura"
              echo "=== coverage slice $SLICE_NO/$TOTAL_SLICES"
              # shellcheck disable=SC2086
              coverlet "$TDIR" --target dotnet \
                --targetargs "test ${{ inputs.test_project }} --no-build --blame-hang-timeout 25m --blame-hang-dump-type mini --filter \"$FILTER\"" \
                $FORMATS --output ./coverage/ \
                $MERGE "${INCLUDES[@]}" 2>&1 | tee -a "$RUNNER_TEMP/test-report.txt"
              test "${PIPESTATUS[0]}" -eq 0
            done < ./coverage/slices.txt
          fi
              ;;
          esac
          # empty-report guard: instrumentation regressions must fail here, not
          # as a misleading 0% in the diff-coverage gate
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("./coverage/coverage.cobertura.xml").getroot()
          if not any(True for _ in root.iter("class")):
              print("::error::coverage report is EMPTY — instrumentation collected nothing")
              sys.exit(1)
          PY

      - name: Bind coverage evidence to the immutable source
        if: inputs.test_project != ''
        run: |
          COBERTURA=$(find "$GITHUB_WORKSPACE/coverage" -name coverage.cobertura.xml -type f -print -quit)
          test -n "$COBERTURA"
          python3 .ci-templates/cicd/lib/source-evidence.py capture \
            --repo "$GITHUB_WORKSPACE" \
            --allow-untracked .ci-templates \
            --artifact "$COBERTURA" \
            --output "$RUNNER_TEMP/tier0-source-evidence.json"
          python3 .ci-templates/cicd/lib/source-evidence.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --allow-untracked .ci-templates \
            --artifact "$COBERTURA" \
            --evidence "$RUNNER_TEMP/tier0-source-evidence.json"

      - name: Restart LibreTranslate sidecar (if we stopped it)
        if: always()
        run: sudo -n /usr/bin/systemctl start libretranslate.service 2>/dev/null || true

      - name: Diff-coverage gate (line + branch of changed lines)
        id: diffcov
        if: inputs.test_project != ''
        run: |
          COBERTURA=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          .ci-templates/cicd/lib/diff-coverage.sh --cobertura "$COBERTURA" \
            --min "${{ inputs.min_diff_coverage }}" \
            --min-branch "${{ inputs.min_diff_branch }}" \
            --base "origin/${{ github.base_ref }}" -v

      # Total-coverage floor + ratchet. Runs even at min 0 so every PR's log carries
      # the whole-codebase line+branch number + worst-offender list. When a baseline
      # path is given, measured may never drop below the committed high-water mark;
      # the upward bump on green merge is done by the post-merge ratchet job, never here.
      - name: Full-coverage gate (total line + branch, ratchet)
        id: fullcov
        if: inputs.test_project != ''
        run: |
          COBERTURA=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          BASELINE_ARG=""
          if [ -n "${{ inputs.coverage_baseline }}" ]; then
            # Use the LOWER of base-branch vs PR-branch baselines. Ratchet-bump
            # PRs carry a RAISED value — the base (lower) wins so the gate passes.
            # Baseline-lowering PRs carry a REDUCED value — the PR (lower) wins so
            # the deliberate reduction can land without the gate blocking on the
            # old (higher) floor.
            BASE_BASELINE="/tmp/base-coverage-baseline.json"
            PR_BASELINE="${{ inputs.coverage_baseline }}"
            CHOSEN=""
            if git show "origin/${{ github.base_ref }}:${{ inputs.coverage_baseline }}" > "$BASE_BASELINE" 2>/dev/null; then
              if [ -f "$PR_BASELINE" ]; then
                BL=$(python3 -c "import json; d=json.load(open('$BASE_BASELINE')); print(d.get('line',0))")
                PL=$(python3 -c "import json; d=json.load(open('$PR_BASELINE')); print(d.get('line',0))")
                BB=$(python3 -c "import json; d=json.load(open('$BASE_BASELINE')); print(d.get('branch',0))")
                PB=$(python3 -c "import json; d=json.load(open('$PR_BASELINE')); print(d.get('branch',0))")
                if python3 -c "exit(0 if $PL < $BL or $PB < $BB else 1)"; then
                  CHOSEN="$PR_BASELINE"
                else
                  CHOSEN="$BASE_BASELINE"
                fi
              else
                CHOSEN="$BASE_BASELINE"
              fi
            elif [ -f "$PR_BASELINE" ]; then
              CHOSEN="$PR_BASELINE"
            fi
            [ -n "$CHOSEN" ] && BASELINE_ARG="--baseline $CHOSEN"
          fi
          # shellcheck disable=SC2086
          .ci-templates/cicd/lib/full-coverage.sh --cobertura "$COBERTURA" \
            --min "${{ inputs.min_total_coverage }}" \
            --min-branch "${{ inputs.min_total_branch }}" \
            $BASELINE_ARG -v

      # Per-namespace/per-class HTML + text report attached to the PR checks, so the
      # spread is visible — not just one number. Never gates (|| true); pure evidence.
      - name: Coverage report artifact (ReportGenerator)
        id: covreport
        if: inputs.test_project != '' && always()
        continue-on-error: true
        run: |
          COBERTURA=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          [ -n "$COBERTURA" ] || exit 0
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:$COBERTURA" "-targetdir:./coverage/report" \
            "-reporttypes:Html;TextSummary" >/dev/null 2>&1 || true
          if [ -f ./coverage/report/Summary.txt ]; then
            { echo "## Coverage report (${{ inputs.domain }})"; echo '```'; \
              cat ./coverage/report/Summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: inputs.test_project != '' && always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ inputs.domain }}
          path: coverage/report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload exact-source evidence
        if: inputs.test_project != '' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-evidence-${{ inputs.domain }}
          path: ${{ runner.temp }}/tier0-source-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach failure report
        if: failure()
        run: |
          echo "## Zero-tolerance gate failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { tail -100 .ci-templates/cicd/reports/findings.txt 2>/dev/null || true; \
            tail -100 "$RUNNER_TEMP/test-report.txt" 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Retry-tracker — record result, elevate at limit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outcome }}
          TEST: ${{ steps.test.outcome }}
          DIFFCOV: ${{ steps.diffcov.outcome }}
          FULLCOV: ${{ steps.fullcov.outcome }}
        run: |
          # Record only real verdicts. If the gate never ran (checkout/setup died →
          # outcome skipped/cancelled) there is no code verdict, and an infra death
          # must not consume the rework budget toward step3-elevate.
          if [ "$GATE" = "failure" ] || [ "$TEST" = "failure" ] || [ "$DIFFCOV" = "failure" ] || [ "$FULLCOV" = "failure" ]; then
            RESULT="fail"
          elif [ "$GATE" = "success" ]; then
            RESULT="pass"
          else
            echo "retry-tracker: gate did not run (gate=$GATE) — infra failure, not recording."
            exit 0
          fi
          .ci-templates/cicd/lib/retry-tracker.sh --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --result "$RESULT" --limit "${{ inputs.retry_limit }}" -v
